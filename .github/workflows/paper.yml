name: Paper

on:
  push:
    branches: [main]
    paths: ["paper/**", "docs/figures/**", ".github/workflows/paper.yml"]
  pull_request:
    paths: ["paper/**", "docs/figures/**", ".github/workflows/paper.yml"]
  workflow_dispatch:

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX Live
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-science lmodern

      - name: Build PDFs
        working-directory: paper
        run: latexmk main.tex supplementary.tex

      - name: Fail on undefined citations or references
        working-directory: paper
        run: |
          if grep -E "(Citation|Reference) .* undefined" build/main.log build/supplementary.log; then
            echo "::error::Undefined citations or references in the manuscript or SI"
            exit 1
          fi

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: manuscript
          path: |
            paper/build/main.pdf
            paper/build/supplementary.pdf
          retention-days: 90
